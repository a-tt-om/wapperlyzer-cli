[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "wapper-cli"
version = "1.0.0"
description = "Detect web technologies from the command line using headless browser analysis"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "colorama",
    "requests",
    "playwright",
    "beautifulsoup4",
    "dnspython",
]

[project.scripts]
wapper = "wapper:main"

[tool.setuptools]
py-modules = ["wapper"]

[tool.setuptools.package-dir]
"" = "src"
